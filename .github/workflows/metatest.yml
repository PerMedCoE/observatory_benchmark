name: table1-regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r meta_test/requirements.txt
      - name: Recompute the Table 1 values
        run: python meta_test/table1_summary.py --repo . --out /tmp/run
      - name: Compare with the frozen baseline
        run: python meta_test/compare_table1.py meta_test/baseline_30df0bc1d /tmp/run --out /tmp/run/comparison.md
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table1-comparison
          path: /tmp/run/